[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fitvoice"
version = "1.0.0"
description = "FitVoice: Genuine Multi-Agent AI System for Voice-First Fitness & Recovery Intelligence"
authors = [
    { name = "FitVoice Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.0",
    "langchain-core>=1.7.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.35.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

